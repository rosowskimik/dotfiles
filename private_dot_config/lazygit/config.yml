git:
  autoFetch: false
  autoStageResolvedConflicts: false
  commitPrefix:
    - pattern: "^(\\d+)-.*$"
      replace: '[#$1] '
  diffRenderers:
    - colorArg: always
      command: delta --dark --paging=never --line-numbers --hyperlinks --hyperlinks-file-link-format="lazygit-edit://{path}:{line}"
gui:
  language: "en"
  border: single
  nerdFontsVersion: 3
os:
  editPreset: "nvim"
keybinding:
  commits:
    moveDownCommit: 'J'
    moveUpCommit: 'K'
customCommands:
  - key: 'ctrl+a'
    context: 'commits'
    description: "Sign-off commit(s)"
    loadingText: "Signing-off..."
    command: |
      branch=$(git symbolic-ref --quiet --short HEAD) &&
      if git rev-parse --verify --quiet {{.SelectedCommitRange.From}}^ >/dev/null 2>&1; then
        git rebase --signoff --autostash {{.SelectedCommitRange.From}}^ {{.SelectedCommitRange.To}}
      else
        git rebase --signoff --autostash --root {{.SelectedCommitRange.To}}
      fi &&
      git rebase --onto HEAD {{.SelectedCommitRange.To}} "$branch" --autostash
